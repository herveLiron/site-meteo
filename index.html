<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Normales de température horaires — Saintes</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page-plane:     #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --series-1:       #2a78d6; /* avant 2000 */
    --series-2:       #eb6834; /* 2000-2014 */
    --series-3:       #1baf7a; /* depuis 2015 */
    --series-4:       #eda100; /* mesuré aujourd'hui */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page-plane:     #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --series-1:       #3987e5;
      --series-2:       #d95926;
      --series-3:       #199e70;
      --series-4:       #c98500;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page-plane);
    color: var(--text-primary);
  }

  .page {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 16px 48px;
  }

  header h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 4px;
  }

  header p.subtitle {
    margin: 0;
    color: var(--text-secondary);
    font-size: 14px;
  }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-top: 20px;
    padding: 20px;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }

  .date-label {
    font-size: 18px;
    font-weight: 600;
    min-width: 170px;
  }

  .controls .spacer { flex: 1; }

  button.nav-btn, button.today-btn {
    font-family: inherit;
    font-size: 13px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-primary);
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
  }
  button.nav-btn:hover, button.today-btn:hover {
    background: var(--gridline);
  }

  input[type="range"] {
    width: 100%;
    accent-color: var(--series-1);
    margin: 4px 0 0;
  }

  .chart-wrap {
    position: relative;
    height: 380px;
    margin-top: 16px;
  }

  .foot-note {
    margin-top: 14px;
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .warn-box {
    display: none;
    margin-top: 14px;
    font-size: 13px;
    color: var(--text-secondary);
    background: var(--page-plane);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Normales de température horaires — Saintes</h1>
    <p class="subtitle">Station Météo-France de référence · Charente-Maritime · données publiques DPClim</p>
  </header>

  <div class="card">
    <div class="controls">
      <button class="nav-btn" id="prev-day" aria-label="Jour précédent">◀</button>
      <div class="date-label" id="date-label">—</div>
      <button class="nav-btn" id="next-day" aria-label="Jour suivant">▶</button>
      <div class="spacer"></div>
      <button class="today-btn" id="today-btn">Aujourd'hui</button>
    </div>
    <input type="range" id="day-slider" min="1" max="365" value="1" aria-label="Jour de l'année">

    <div class="chart-wrap">
      <canvas id="chart"></canvas>
    </div>

    <div class="foot-note" id="foot-note"></div>
  </div>
</div>

const MOIS_FR = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const JOURS_PAR_MOIS = [31,28,31,30,31,30,31,31,30,31,30,31]; // année non bissextile, base 365 jours

function doyToDateLabel(doy) {
  let d = doy;
  for (let m = 0; m < 12; m++) {
    if (d <= JOURS_PAR_MOIS[m]) {
      return `${d} ${MOIS_FR[m]}`;
    }
    d -= JOURS_PAR_MOIS[m];
  }
  return `jour ${doy}`;
}

function todayDoy() {
  const now = new Date();
  const year = now.getFullYear();
  const start = new Date(year, 0, 1);
  const diff = Math.floor((now - start) / 86400000) + 1;
  const isBissextile = (year % 4 === 0 && (year % 100 !== 0 || year % 400 === 0));
  if (isBissextile && diff >= 60) return diff - 1; // fusionne le 29 fevrier
  return Math.min(diff, 365);
}

const PERIODES = [
  { key: "avant_2000",  label: "Avant 2000",   varColor: "--series-1" },
  { key: "2000_2014",   label: "2000 – 2014",  varColor: "--series-2" },
  { key: "depuis_2015", label: "Depuis 2015",  varColor: "--series-3" },
];

const HEURES = Array.from({length: 24}, (_, h) => `${h}h`);

const SERIE_MESUREE = { label: "Mesuré aujourd'hui", varColor: "--series-4" };
let liveData = null; // { date, hourly: [24 valeurs ou null], updated_at } — toujours "aujourd'hui"
const archiveCache = new Map(); // "AAAA-MM-JJ" -> hourly[24] | null (null = pas de donnée archivée)

function dateToISO(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

// Convertit un "jour de l'année" (1-365, modèle simplifié sans année, cf. todayDoy) en la
// date réelle la plus récente correspondant à cette position dans le cycle annuel :
// cette année si le jour est déjà passé, sinon l'année précédente.
function doyToRecentDate(doy) {
  const delta = todayDoy() - doy;
  const wrapped = delta >= 0 ? delta : delta + 365;
  const d = new Date();
  d.setDate(d.getDate() - wrapped);
  return d;
}

// Charge (si besoin) la donnée mesurée archivée pour le jour `doy`, puis redessine le
// graphique une fois arrivée si l'utilisateur est toujours sur ce jour-là. "Aujourd'hui"
// est géré à part par fetchLiveData().
async function ensureMeasuredData(doy) {
  if (doy === todayDoy()) return;
  const iso = dateToISO(doyToRecentDate(doy));
  if (archiveCache.has(iso)) return;
  let hourly = null;
  try {
    const resp = await fetch(`/api/exterieur-jour?date=${iso}`);
    const json = await resp.json();
    if (json && Array.isArray(json.hourly) && !json.no_data) hourly = json.hourly;
  } catch (e) {
    // Silencieux : la courbe mesurée est un complément, pas bloquant pour le reste de la page.
  }
  archiveCache.set(iso, hourly);
  if (typeof currentDoy !== 'undefined' && currentDoy === doy) render(currentDoy);
}

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

let chart;

function buildDatasets(doy) {
  const datasets = PERIODES.map(p => ({
    label: p.label,
    data: (NORMALES[p.key] && NORMALES[p.key][String(doy)]) || Array(24).fill(null),
    borderColor: cssVar(p.varColor),
    backgroundColor: cssVar(p.varColor),
    borderWidth: 2,
    pointRadius: 0,
    pointHoverRadius: 5,
    pointHitRadius: 12,
    tension: 0.35,
    spanGaps: true,
  }));

  const activeDate = doyToRecentDate(doy);
  const activeISO = dateToISO(activeDate);
  const isToday = doy === todayDoy();
  const mesureHourly = isToday
    ? (liveData && Array.isArray(liveData.hourly) ? liveData.hourly : null)
    : (archiveCache.get(activeISO) || null);

  if (mesureHourly) {
    datasets.push({
      label: isToday ? SERIE_MESUREE.label : `Mesuré le ${activeDate.toLocaleDateString('fr-FR')}`,
      data: mesureHourly,
      borderColor: cssVar(SERIE_MESUREE.varColor),
      backgroundColor: cssVar(SERIE_MESUREE.varColor),
      borderWidth: 2,
      pointRadius: 0,
      pointHoverRadius: 6,
      pointHitRadius: 12,
      tension: 0.2,
      spanGaps: false,
    });
  }

  return datasets;
}

function chartOptions() {
  const textSecondary = cssVar('--text-secondary');
  const textMuted = cssVar('--text-muted');
  const gridline = cssVar('--gridline');
  const surface = cssVar('--surface-1');
  const textPrimary = cssVar('--text-primary');
  return {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: {
        position: 'top',
        align: 'start',
        labels: {
          color: textSecondary,
          usePointStyle: true,
          pointStyle: 'line',
          boxWidth: 24,
          font: { size: 12 },
          padding: 16,
        },
      },
      tooltip: {
        backgroundColor: surface,
        titleColor: textPrimary,
        bodyColor: textPrimary,
        borderColor: gridline,
        borderWidth: 1,
        padding: 10,
        titleFont: { size: 12, weight: '600' },
        bodyFont: { size: 12 },
        callbacks: {
          label: (ctx) => {
            const v = ctx.parsed.y;
            return `  ${ctx.dataset.label} : ${v === null ? '—' : v.toFixed(1) + ' °C'}`;
          },
        },
      },
    },
    scales: {
      x: {
        grid: { color: gridline, display: false },
        ticks: { color: textMuted, font: { size: 11 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 12 },
      },
      y: {
        grid: { color: gridline },
        border: { display: false },
        ticks: {
          color: textMuted,
          font: { size: 11 },
          callback: (v) => `${v}°`,
        },
        title: { display: false },
      },
    },
  };
}

function render(doy) {
  document.getElementById('date-label').textContent = doyToDateLabel(doy);
  document.getElementById('day-slider').value = doy;

  const datasets = buildDatasets(doy);
  footNote();

  if (!chart) {
    const ctx = document.getElementById('chart').getContext('2d');
    chart = new Chart(ctx, {
      type: 'line',
      data: { labels: HEURES, datasets },
      options: chartOptions(),
    });
  } else {
    chart.data.datasets = datasets;
    chart.options = chartOptions();
    chart.update('none');
  }
}

function footNote() {
  const meta = NORMALES.meta || {};
  const fenetre = meta.fenetre_jours;
  const per = meta.periodes || {};
  const parts = PERIODES.map(p => `${p.label} : ${per[p.key] ? per[p.key].nb_annees : '?'} ans`);
  let texte = `Médiane horaire calculée sur une fenêtre glissante de ±${fenetre} jours autour de la date affichée, toutes années confondues par période. ${parts.join(' · ')}. Source : Météo-France, données publiques DPClim.`;
  const isToday = typeof currentDoy !== 'undefined' && currentDoy === todayDoy();
  if (isToday) {
    if (liveData && liveData.updated_at) {
      const maj = new Date(liveData.updated_at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
      texte += ` Courbe « Mesuré aujourd'hui » : station météo personnelle, mise à jour à ${maj}.`;
    }
  } else if (typeof currentDoy !== 'undefined') {
    const activeISO = dateToISO(doyToRecentDate(currentDoy));
    if (archiveCache.has(activeISO)) {
      texte += archiveCache.get(activeISO)
        ? ` Courbe « Mesuré » : archive de la station météo personnelle pour cette journée.`
        : ` Pas de donnée mesurée archivée pour cette journée (hors de la fenêtre d'environ 1 an, ou jour non couvert).`;
    }
  }
  document.getElementById('foot-note').textContent = texte;
}

async function fetchLiveData() {
  try {
    const resp = await fetch('/api/exterieur-jour');
    if (!resp.ok) return;
    const json = await resp.json();
    liveData = json;
    footNote();
    if (currentDoy === todayDoy()) render(currentDoy);
  } catch (e) {
    // Silencieux : la courbe mesurée est un complément, pas bloquant pour le reste de la page.
  }
}

let currentDoy = todayDoy();

document.getElementById('day-slider').addEventListener('input', (e) => {
  currentDoy = parseInt(e.target.value, 10);
  render(currentDoy);
  ensureMeasuredData(currentDoy);
});
document.getElementById('prev-day').addEventListener('click', () => {
  currentDoy = currentDoy <= 1 ? 365 : currentDoy - 1;
  render(currentDoy);
  ensureMeasuredData(currentDoy);
});
document.getElementById('next-day').addEventListener('click', () => {
  currentDoy = currentDoy >= 365 ? 1 : currentDoy + 1;
  render(currentDoy);
  ensureMeasuredData(currentDoy);
});
document.getElementById('today-btn').addEventListener('click', () => {
  currentDoy = todayDoy();
  render(currentDoy);
  ensureMeasuredData(currentDoy);
});

window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (chart) {
    chart.data.datasets = buildDatasets(currentDoy);
    chart.options = chartOptions();
    chart.update('none');
  }
});

footNote();
render(currentDoy);
fetchLiveData();
setInterval(fetchLiveData, 5 * 60 * 1000);
</script>
</body>
</html>
